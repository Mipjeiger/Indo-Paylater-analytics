# nginx reverse-proxy config for PayLater Intelligence frontend.
# Handles SPA routing + forwards /api/* and ML score/classify
# paths to the fastapi service on the Docker internal network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Healthcheck probe (used by Docker HEALTHCHECK) ────────
    location = /health.txt {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── API reverse-proxy (/api/v1/* → fastapi:8000) ──────────
    location /api/ {
        proxy_pass         http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── ML scoring endpoints (/score/* → fastapi:8000) ────────
    location /score/ {
        proxy_pass         http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Root-cause classify endpoint (/classify/* → fastapi) ──
    location /classify/ {
        proxy_pass         http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Health check passthrough (/health → fastapi) ──────────
    location /health {
        proxy_pass         http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }

    # ── Prometheus metrics passthrough (/metrics → fastapi) ───
    location /metrics {
        proxy_pass         http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }

    # ── SPA fallback: all other paths serve index.html ────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
