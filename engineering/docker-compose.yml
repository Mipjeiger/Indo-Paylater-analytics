services:
  
  postgres:
    image: postgres:16
    container_name: Postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - paylater_indodana

  redis:
    image: redis:7
    container_name: Redis
    ports:
      - "6379:6379"
    networks:
      - paylater_indodana

  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: Redis-UI
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - paylater_indodana

  minio:
    image: minio/minio:RELEASE.2023-09-21T23-10-00Z
    container_name: Minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - paylater_indodana
    volumes:
      - minio_data:/data
      - ./minio.license:/minio.license:ro

  fastapi:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: Fastapi
    environment:
      environment:
      # Database configuration
      POSTGRES_DSN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}


      # MinIO & MLflow configuration
      MINIO_ENDPOINT: minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

      # LLM API keys
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-http://host.docker.internal:20128/v1}
      NINEROUTER_MODEL_NAME: ${NINEROUTER_MODEL_NAME}
     
      # Other configurations
      ENABLE_PROMETHEUS_EXPORTER: "true"
      PREFECT_API_URL: http://prefect:4200/api
      FRONTEND_ORIGIN: http://localhost:8085

      # Actions control
      ACTION_KILL_SWITCH: "0"
      AUTO_BLOCK: "0"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - postgres
    networks:
      - paylater_indodana

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0-full
    container_name: Mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --allowed-hosts '*'
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://paylater-models/mlflow/
      --serve-artifacts
    ports:
      - "5002:5000"
    env_file:
      - .env
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - mlflow_data:/mlflow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - minio
    networks:
      - paylater_indodana

  Prefect:
    image: prefecthq/prefect:3-python3.11
    container_name: Prefect
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_ORION_UI_API_URL: http://prefect:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: false
      PREFECT_SERVER_API_HOST: 0.0.0.0
    networks:
      - paylater_indodana
    volumes:
      - prefect_data:/root/.prefect

    prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks:
      - paylater_indodana

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports: ["3000:3000"]
    networks:
      - paylater_indodana

volumes:
  pgdata:
  mlflow_data:
  prefect_data:
  prometheus_data:
  grafana_data:

networks:
  paylater_indodana:
    name: paylater_indodana
    driver: bridge
